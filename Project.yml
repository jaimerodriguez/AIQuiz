name: AIQuiz
options:
  bundleIdPrefix: com.jaimerodriguez.aiquiz
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  AIQuizCore:
    path: Packages/AIQuizCore
  LLMKit:
    path: Packages/LLMKit

targets:
  AIQuiz:
    type: application
    platform: iOS
    sources:
      - path: AIQuiz
        excludes:
          - "Info.plist"
    resources:
      - path: AIQuiz/Resources/SampleQuizzes
        type: folder
      - path: AIQuiz/Resources/TestFixtures
        type: folder
    dependencies:
      - package: AIQuizCore
      - package: LLMKit
    info:
      path: AIQuiz/Info.plist
      properties:
        CFBundleDisplayName: AIQuiz
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "AIQuiz uses the microphone so you can answer prompts by speaking."
        NSSpeechRecognitionUsageDescription: "AIQuiz transcribes your spoken answers and listens for the 'hint' voice command."
        NSLocalNetworkUsageDescription: "AIQuiz connects to AI model servers on your local network, such as Ollama or LM Studio, when you add one as an endpoint."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaimerodriguez.aiquiz
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: AIQuiz/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X824J47H9D
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.1.0"

  AIQuizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AIQuizTests
    dependencies:
      - target: AIQuiz
      - package: AIQuizCore
      - package: LLMKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: X824J47H9D
        CODE_SIGN_STYLE: Automatic

  AIQuizUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AIQuizUITests
    dependencies:
      - target: AIQuiz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: X824J47H9D
        CODE_SIGN_STYLE: Automatic

schemes:
  AIQuiz:
    build:
      targets:
        AIQuiz: all
        AIQuizTests: [test]
        AIQuizUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIQuizTests
        - AIQuizUITests
